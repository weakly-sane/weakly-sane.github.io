<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="headMetal" x1="4" y1="3" x2="19" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".18" stop-color="#F7FBFF"/>
      <stop offset=".50" stop-color="#DDEEFF"/>
      <stop offset=".78" stop-color="#9CCBFA"/>
      <stop offset="1" stop-color="#5F9FE8"/>
    </linearGradient>
    <linearGradient id="headFacet" x1="5" y1="4" x2="14" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".98"/>
      <stop offset=".58" stop-color="#EAF6FF" stop-opacity=".70"/>
      <stop offset="1" stop-color="#A6D1FF" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="shaftMetal" x1="14" y1="14" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".22" stop-color="#EAF6FF"/>
      <stop offset=".56" stop-color="#BBDFFF"/>
      <stop offset=".82" stop-color="#82B9EE"/>
      <stop offset="1" stop-color="#D7EDFF"/>
    </linearGradient>
    <linearGradient id="fletchA" x1="41" y1="37" x2="59" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".94"/>
      <stop offset=".36" stop-color="#DFF1FF" stop-opacity=".88"/>
      <stop offset=".72" stop-color="#99C9F8" stop-opacity=".72"/>
      <stop offset="1" stop-color="#5E9BE3" stop-opacity=".52"/>
    </linearGradient>
    <linearGradient id="fletchB" x1="38" y1="41" x2="55" y2="59" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF7FF" stop-opacity=".92"/>
      <stop offset=".52" stop-color="#BBDFFF" stop-opacity=".76"/>
      <stop offset="1" stop-color="#6BA7EA" stop-opacity=".48"/>
    </linearGradient>
    <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <filter id="fineGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation=".75"/>
    </filter>
  </defs>

  <!-- restrained moon-blue aura -->
  <g opacity=".46" filter="url(#softGlow)">
    <path d="M4 3.5L20.5 8.8L10.1 19.1L4 3.5Z" fill="#B8DEFF"/>
    <path d="M12.2 12.1L54.1 54.0" stroke="#7DBBFF" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M42.4 38.7L60.2 45.5L50.7 55.1L42.4 38.7Z" fill="#7AB8FB"/>
    <path d="M38.9 42.5L55.1 50.8L45.4 60.2L38.9 42.5Z" fill="#74B2F7"/>
  </g>

  <!-- sculpted arrowhead -->
  <path d="M3.7 3.5L21.2 8.8L10.2 19.8L3.7 3.5Z"
        fill="url(#headMetal)"
        stroke="#F7FCFF"
        stroke-width=".9"
        stroke-linejoin="round"/>
  <path d="M5.0 4.7L17.4 8.5L9.7 16.1L5.0 4.7Z"
        fill="url(#headFacet)"/>
  <path d="M5.9 5.5L13.6 7.8L8.9 12.5"
        stroke="#FFFFFF"
        stroke-opacity=".82"
        stroke-width=".72"
        stroke-linecap="round"/>
  <path d="M9.9 19.0L11.8 13.0L20.2 9.5"
        stroke="#6FA8E9"
        stroke-opacity=".58"
        stroke-width=".55"
        stroke-linecap="round"/>

  <!-- collar -->
  <path d="M11.1 11.0L15.6 15.5"
        stroke="#FFFFFF"
        stroke-opacity=".88"
        stroke-width="2.5"
        stroke-linecap="round"
        filter="url(#fineGlow)"/>
  <path d="M11.1 11.0L15.6 15.5"
        stroke="#B9DFFF"
        stroke-width="1.05"
        stroke-linecap="round"/>

  <!-- slim faceted shaft -->
  <path d="M14.4 14.3L53.4 53.3"
        stroke="#6EADF3"
        stroke-opacity=".38"
        stroke-width="3.6"
        stroke-linecap="round"
        filter="url(#fineGlow)"/>
  <path d="M14.4 14.3L53.4 53.3"
        stroke="url(#shaftMetal)"
        stroke-width="1.55"
        stroke-linecap="round"/>
  <path d="M15.6 15.5L51.8 51.7"
        stroke="#FFFFFF"
        stroke-opacity=".64"
        stroke-width=".46"
        stroke-linecap="round"/>

  <!-- delicate binding -->
  <path d="M41.1 39.3L44.7 42.9" stroke="#FFFFFF" stroke-opacity=".72" stroke-width="1.85" stroke-linecap="round"/>
  <path d="M42.0 38.5L45.6 42.1" stroke="#7CB8F5" stroke-opacity=".58" stroke-width=".62" stroke-linecap="round"/>
  <path d="M40.3 40.2L43.8 43.7" stroke="#7CB8F5" stroke-opacity=".50" stroke-width=".62" stroke-linecap="round"/>

  <!-- crystalline fletching -->
  <path d="M40.8 36.7L60.0 44.7L50.7 54.0L40.8 36.7Z"
        fill="url(#fletchA)"
        stroke="#F4FBFF"
        stroke-opacity=".72"
        stroke-width=".62"
        stroke-linejoin="round"/>
  <path d="M36.7 40.8L54.0 50.7L44.7 60.0L36.7 40.8Z"
        fill="url(#fletchB)"
        stroke="#EAF6FF"
        stroke-opacity=".62"
        stroke-width=".62"
        stroke-linejoin="round"/>

  <!-- feather facets / ribs -->
  <path d="M43.3 40.1L54.7 44.9" stroke="#FFFFFF" stroke-opacity=".46" stroke-width=".52" stroke-linecap="round"/>
  <path d="M46.1 42.2L56.9 46.6" stroke="#BFE2FF" stroke-opacity=".42" stroke-width=".48" stroke-linecap="round"/>
  <path d="M40.1 43.3L44.9 54.7" stroke="#FFFFFF" stroke-opacity=".38" stroke-width=".52" stroke-linecap="round"/>
  <path d="M42.2 46.1L46.6 56.9" stroke="#BFE2FF" stroke-opacity=".34" stroke-width=".48" stroke-linecap="round"/>

  <!-- nock jewel / termination -->
  <circle cx="53.5" cy="53.5" r="1.55" fill="#EFF9FF" stroke="#8BC5FF" stroke-width=".65"/>
  <circle cx="53.5" cy="53.5" r=".55" fill="#FFFFFF"/>
  <path d="M54.8 54.8L59.2 59.2" stroke="#DCEFFF" stroke-width="1.12" stroke-linecap="round"/>
  <path d="M57.3 57.2L60.3 54.3" stroke="#76B2F4" stroke-width=".78" stroke-linecap="round"/>
</svg>