name: Unblock Pages queue

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unblock-pages.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-stuck-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck Pages workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail-with-body             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/${{ github.repository }}/actions/runs/42562973646/cancel
