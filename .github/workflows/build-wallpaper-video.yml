name: Build animated wallpaper video

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-wallpaper-video.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless

      - name: Render seamless wallpaper loop
        run: |
          cat > /tmp/render_wallpaper.py <<'PY'
          import cv2
          import numpy as np
          import subprocess
          import math
          from pathlib import Path

          root = Path('assets/wallpaper')
          src = cv2.imread(str(root / 'iuno.jpg'), cv2.IMREAD_COLOR)
          if src is None:
              raise SystemExit('Wallpaper image is missing')

          W, H = 1920, 1080
          FPS = 24
          SECONDS = 8
          N = FPS * SECONDS

          src = cv2.resize(src, (W, H), interpolation=cv2.INTER_AREA)
          yy, xx = np.mgrid[0:H, 0:W].astype(np.float32)
          xn = xx / W
          yn = yy / H

          def ellipse(cx, cy, rx, ry, softness=2.8):
              q = ((xn-cx)/rx)**2 + ((yn-cy)/ry)**2
              return np.exp(-q*softness).astype(np.float32)

          # Character/boat live on the right half of the scene.
          # Boat mask includes the seated character so they float together.
          boat = np.maximum(
              ellipse(.69, .63, .31, .34, 3.2),
              ellipse(.60, .48, .22, .30, 3.0)
          )
          boat = np.clip((boat - .055) / .80, 0, 1)

          # Body-only region for a tiny independent breathing motion.
          body = ellipse(.62, .43, .14, .23, 3.6)
          body = np.clip((body - .08) / .78, 0, 1)

          # Water is the lower part of the scene. Remove most of the boat/person
          # region so waves do not bend the character.
          water = np.clip((yn - .54) / .34, 0, 1)
          water *= np.clip(1.0 - boat*.92, 0, 1)
          water = cv2.GaussianBlur(water, (0,0), 5.0)

          base_x = xx.copy()
          base_y = yy.copy()
          cx, cy = .62*W, .43*H

          out = root / 'iuno-loop.mp4'
          cmd = [
              'ffmpeg', '-y',
              '-f', 'rawvideo', '-vcodec', 'rawvideo',
              '-pix_fmt', 'bgr24', '-s', f'{W}x{H}', '-r', str(FPS), '-i', '-',
              '-an', '-c:v', 'libx264', '-preset', 'medium', '-crf', '22',
              '-pix_fmt', 'yuv420p', '-movflags', '+faststart',
              str(out)
          ]
          proc = subprocess.Popen(cmd, stdin=subprocess.PIPE)

          try:
              for i in range(N):
                  p = 2.0 * math.pi * i / N

                  # Visible water motion: texture ripples, never a whole-layer bob.
                  wx = (
                      5.8*np.sin(xx*(2*math.pi/210.0) + 2.0*p)
                      + 2.8*np.sin(yy*(2*math.pi/120.0) - 1.0*p)
                  )
                  wy = (
                      2.2*np.sin(xx*(2*math.pi/170.0) - 1.25*p)
                      + 1.5*np.sin((xx+yy)*(2*math.pi/270.0) + 1.5*p)
                  )

                  # Boat + seated character: slow buoyant motion.
                  boat_y = 2.5 * math.sin(p)
                  boat_x = 0.35 * math.sin(p + .65)

                  # Character breathing: coherent torso expansion, extremely weak.
                  breath = math.sin(2.0*p)
                  sx = 0.00012 * breath
                  sy = 0.00038 * breath
                  lift = -0.16 * breath

                  dx = water*wx + boat*boat_x
                  dy = water*wy + boat*boat_y

                  dx += body*((xx-cx)*sx)
                  dy += body*((yy-cy)*sy + lift)

                  frame = cv2.remap(
                      src,
                      (base_x-dx).astype(np.float32),
                      (base_y-dy).astype(np.float32),
                      interpolation=cv2.INTER_CUBIC,
                      borderMode=cv2.BORDER_REFLECT101
                  )

                  # Gentle independent shimmer on the water.
                  shimmer = 1.0 + (0.010*math.sin(p+1.1))*water
                  frame = np.clip(
                      frame.astype(np.float32)*shimmer[...,None],
                      0,255
                  ).astype(np.uint8)

                  proc.stdin.write(frame.tobytes())
          finally:
              proc.stdin.close()
              rc = proc.wait()

          if rc != 0:
              raise SystemExit(f'ffmpeg failed with exit code {rc}')

          print(out, out.stat().st_size)
          PY
          python /tmp/render_wallpaper.py

      - name: Commit video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/wallpaper/iuno-loop.mp4
          git diff --cached --quiet && exit 0
          git commit -m 'Build animated wallpaper loop'
          git pull --rebase origin main
          git push
