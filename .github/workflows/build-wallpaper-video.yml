name: Build animated wallpaper video

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-wallpaper-video.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless

      - name: Render seamless wallpaper loop
        run: |
          cat > /tmp/render_wallpaper.py <<'PY'
          import cv2
          import numpy as np
          import subprocess
          import math
          from pathlib import Path

          root = Path('assets/wallpaper')
          src = cv2.imread(str(root / 'iuno.jpg'), cv2.IMREAD_COLOR)
          body = cv2.imread(str(root / 'body-mask.png'), cv2.IMREAD_GRAYSCALE)
          boat = cv2.imread(str(root / 'boat-mask.png'), cv2.IMREAD_GRAYSCALE)
          water = cv2.imread(str(root / 'water-mask.png'), cv2.IMREAD_GRAYSCALE)

          if src is None or body is None or boat is None or water is None:
              raise SystemExit('Wallpaper assets are missing')

          W, H = 1920, 1080
          FPS = 24
          SECONDS = 8
          N = FPS * SECONDS

          src = cv2.resize(src, (W, H), interpolation=cv2.INTER_AREA)
          body = cv2.resize(body, (W, H), interpolation=cv2.INTER_LINEAR).astype(np.float32) / 255.0
          boat = cv2.resize(boat, (W, H), interpolation=cv2.INTER_LINEAR).astype(np.float32) / 255.0
          water = cv2.resize(water, (W, H), interpolation=cv2.INTER_LINEAR).astype(np.float32) / 255.0

          # Soften mask edges; keep the three motions independent.
          body = cv2.GaussianBlur(body, (0, 0), 2.0)
          boat = cv2.GaussianBlur(boat, (0, 0), 2.2)
          water = cv2.GaussianBlur(water, (0, 0), 1.6)

          yy, xx = np.mgrid[0:H, 0:W].astype(np.float32)
          base_x = xx.copy()
          base_y = yy.copy()

          # Body center for a tiny breathing expansion.
          body_mass = body.sum() + 1e-6
          cx = float((xx * body).sum() / body_mass)
          cy = float((yy * body).sum() / body_mass)

          out = root / 'iuno-loop.mp4'
          cmd = [
              'ffmpeg', '-y',
              '-f', 'rawvideo', '-vcodec', 'rawvideo',
              '-pix_fmt', 'bgr24', '-s', f'{W}x{H}', '-r', str(FPS), '-i', '-',
              '-an', '-c:v', 'libx264', '-preset', 'medium', '-crf', '22',
              '-pix_fmt', 'yuv420p', '-movflags', '+faststart',
              str(out)
          ]
          proc = subprocess.Popen(cmd, stdin=subprocess.PIPE)

          try:
              for i in range(N):
                  p = 2.0 * math.pi * i / N

                  # WATER: texture ripple only. No global vertical translation.
                  # Two wave systems with different wavelengths create visible,
                  # organic surface motion while the mask confines it to water.
                  wx = (
                      5.2 * np.sin(xx * (2.0 * math.pi / 210.0) + p * 1.8)
                      + 2.4 * np.sin(yy * (2.0 * math.pi / 115.0) - p * 1.15)
                  )
                  wy = (
                      2.0 * np.sin(xx * (2.0 * math.pi / 165.0) - p * 1.25)
                      + 1.3 * np.sin((xx + yy) * (2.0 * math.pi / 260.0) + p * 1.5)
                  )

                  # BOAT + CHARACTER: one slow buoyant cycle over the loop.
                  # Because the boat mask includes the seated character, they
                  # rise/fall together naturally.
                  boat_y = 2.8 * math.sin(p)
                  boat_x = 0.45 * math.sin(p + 0.7)

                  # BODY BREATHING: extremely subtle, two breaths per loop.
                  # This is a coherent expansion around the body center, not a wave.
                  breath = math.sin(2.0 * p)
                  body_scale_x = 0.00018 * breath
                  body_scale_y = 0.00055 * breath
                  body_lift = -0.22 * breath

                  dx = water * wx + boat * boat_x
                  dy = water * wy + boat * boat_y

                  dx += body * ((xx - cx) * body_scale_x)
                  dy += body * ((yy - cy) * body_scale_y + body_lift)

                  map_x = (base_x - dx).astype(np.float32)
                  map_y = (base_y - dy).astype(np.float32)

                  frame = cv2.remap(
                      src, map_x, map_y,
                      interpolation=cv2.INTER_CUBIC,
                      borderMode=cv2.BORDER_REFLECT101
                  )

                  # A very small light pulse on the water only, synchronized
                  # with neither boat nor breathing.
                  shimmer = 1.0 + (0.012 * math.sin(p * 1.0 + 1.1)) * water
                  frame = np.clip(frame.astype(np.float32) * shimmer[..., None], 0, 255).astype(np.uint8)

                  proc.stdin.write(frame.tobytes())
          finally:
              proc.stdin.close()
              rc = proc.wait()

          if rc != 0:
              raise SystemExit(f'ffmpeg failed with exit code {rc}')

          print(out, out.stat().st_size)
          PY
          python /tmp/render_wallpaper.py

      - name: Commit video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/wallpaper/iuno-loop.mp4
          git diff --cached --quiet && exit 0
          git commit -m 'Build animated wallpaper loop'
          git push
