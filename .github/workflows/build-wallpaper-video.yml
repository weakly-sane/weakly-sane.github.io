name: Build animated wallpaper video

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-wallpaper-video.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless

      - name: Render seamless wallpaper loop
        run: |
          cat > /tmp/render_wallpaper.py <<'PY'
          import cv2
          import numpy as np
          import subprocess
          import math
          import base64
          from pathlib import Path

          root = Path('assets/wallpaper')
          src = cv2.imread(str(root / 'iuno.jpg'), cv2.IMREAD_COLOR)
          if src is None:
              raise SystemExit('Wallpaper image is missing')

          BASE_W, BASE_H = 1920, 1080
          W, H = 3840, 2160
          SCALE_X = W / BASE_W
          SCALE_Y = H / BASE_H
          PIXEL_SCALE = (SCALE_X + SCALE_Y) * 0.5
          FPS = 165
          SECONDS = 8
          N = FPS * SECONDS
          src = cv2.resize(src, (W, H), interpolation=cv2.INTER_LANCZOS4)

          # Remove the stale time display baked into the cached Steam image.
          # This patch is cropped from the clean original scene artwork.
          patch_bytes = base64.b64decode("")
          patch = cv2.imdecode(np.frombuffer(patch_bytes, np.uint8), cv2.IMREAD_COLOR)
          if patch is None:
              raise SystemExit('Failed to decode clean clock patch')

          x0, y0 = 2700, 1760
          ph, pw = patch.shape[:2]
          region = src[y0:y0+ph, x0:x0+pw].astype(np.float32)

          alpha = np.ones((ph, pw), np.float32)
          feather = 36
          ramp = np.sin(np.linspace(0.0, math.pi / 2.0, feather, dtype=np.float32)) ** 2
          alpha[:feather, :] *= ramp[:, None]
          alpha[-feather:, :] *= ramp[::-1, None]
          alpha[:, :feather] *= ramp[None, :]
          alpha[:, -feather:] *= ramp[None, ::-1]

          cleaned = patch.astype(np.float32) * alpha[..., None] + region * (1.0 - alpha[..., None])
          src[y0:y0+ph, x0:x0+pw] = np.clip(cleaned, 0, 255).astype(np.uint8)

          # These polygons are simplified from the original Wallpaper Engine
          # masks extracted from scene.pkg (coordinates at 1920x1080).
          boat_poly = np.array([
              [683,558],[758,668],[935,774],[838,907],[883,945],[936,929],
              [1015,822],[1423,1079],[1919,1079],[1919,777],[1520,652],
              [1550,623],[1530,520],[1348,511],[1322,461],[1367,433],
              [1347,345],[1261,282],[1184,295],[1148,387],[1174,421],
              [1076,404],[1001,507]
          ], np.int32)

          body_poly = np.array([
              [1300,460],[1269,444],[1197,463],[1190,494],[1136,516],
              [1124,591],[1133,618],[1060,633],[979,688],[940,765],
              [860,870],[850,898],[856,917],[900,934],[961,911],
              [1020,799],[1077,746],[1168,733],[1271,749],[1324,726],
              [1336,692],[1315,628],[1345,578],[1320,493]
          ], np.int32)

          water_main = np.array([
              [0,278],[0,493],[99,550],[81,665],[238,679],[233,735],
              [293,694],[327,739],[300,765],[350,777],[240,839],[115,778],
              [182,941],[0,942],[0,1036],[39,1032],[49,1079],[440,1079],
              [433,1040],[475,1079],[1409,1079],[1036,829],[948,911],
              [852,912],[911,779],[691,570],[903,529],[933,465],[1014,511],
              [1038,431],[587,378],[528,348],[576,298],[374,215],[265,313]
          ], np.int32)

          water_right = np.array([
              [1522,574],[1521,598],[1546,626],[1532,642],[1514,647],
              [1514,658],[1523,667],[1584,681],[1802,751],[1799,748],
              [1820,716],[1823,699],[1794,677],[1784,653],[1773,651],
              [1757,670],[1737,679],[1679,669],[1652,647],[1598,643],
              [1574,633],[1561,617],[1580,601],[1579,583],[1531,568]
          ], np.int32)

          def scale_poly(poly):
              p = poly.astype(np.float32)
              p[:, 0] *= SCALE_X
              p[:, 1] *= SCALE_Y
              return np.rint(p).astype(np.int32)

          boat_poly = scale_poly(boat_poly)
          body_poly = scale_poly(body_poly)
          water_main = scale_poly(water_main)
          water_right = scale_poly(water_right)

          boat = np.zeros((H,W), np.float32)
          body = np.zeros((H,W), np.float32)
          water = np.zeros((H,W), np.float32)

          cv2.fillPoly(boat, [boat_poly], 1.0)
          cv2.fillPoly(body, [body_poly], 1.0)
          cv2.fillPoly(water, [water_main, water_right], 1.0)

          # Soft edges avoid seams while preserving object separation.
          boat = cv2.GaussianBlur(boat, (0,0), 5.0 * PIXEL_SCALE)
          body = cv2.GaussianBlur(body, (0,0), 4.0 * PIXEL_SCALE)
          water = cv2.GaussianBlur(water, (0,0), 3.0 * PIXEL_SCALE)

          yy, xx = np.mgrid[0:H, 0:W].astype(np.float32)
          xn = xx / W
          yn = yy / H

          # Breathing should be torso-only, not the leg/foot.
          torso_fade = np.clip((0.68 - yn) / 0.18, 0, 1)
          torso_fade *= np.clip((xn - 0.50) / 0.10, 0, 1)
          body *= torso_fade

          # Critical: water never displaces the boat, character, or foot.
          water *= np.clip(1.0 - boat * 0.999, 0, 1)
          water = cv2.GaussianBlur(water, (0,0), 1.2 * PIXEL_SCALE)

          base_x = xx.copy()
          base_y = yy.copy()

          body_mass = body.sum() + 1e-6
          cx = float((xx * body).sum() / body_mass)
          cy = float((yy * body).sum() / body_mass)

          out = root / 'iuno-loop-fixed.mp4'
          cmd = [
              'ffmpeg','-y',
              '-f','rawvideo','-vcodec','rawvideo',
              '-pix_fmt','bgr24','-s',f'{W}x{H}','-r',str(FPS),'-i','-',
              '-an','-c:v','libx264','-preset','medium','-crf','19',
              '-pix_fmt','yuv420p',
              '-x264-params',f'keyint={FPS*2}:min-keyint={FPS*2}:scenecut=0',
              '-movflags','+faststart',
              str(out)
          ]
          proc = subprocess.Popen(cmd, stdin=subprocess.PIPE)

          try:
              for i in range(N):
                  # Exactly one closed phase circle. All temporal multipliers
                  # below are integers, so frame N continues smoothly to frame 0.
                  p = 2.0 * math.pi * i / N

                  # WATER: two periodic wave systems; no whole-water translation.
                  wx = (
                      (5.8*PIXEL_SCALE)*np.sin(xx*(2*math.pi/(205.0*PIXEL_SCALE)) + p)
                      + (2.6*PIXEL_SCALE)*np.sin((xx + 0.7*yy)*(2*math.pi/(260.0*PIXEL_SCALE)) - 2.0*p)
                  )
                  wy = (
                      (2.4*PIXEL_SCALE)*np.sin(xx*(2*math.pi/(175.0*PIXEL_SCALE)) - p)
                      + (1.6*PIXEL_SCALE)*np.sin((0.6*xx + yy)*(2*math.pi/(235.0*PIXEL_SCALE)) + 2.0*p)
                  )

                  # BOAT + PERSON: one slow buoyant cycle. The original boat
                  # mask includes the seated character, so both move together.
                  boat_y = (4.2 * PIXEL_SCALE) * math.sin(p)
                  boat_x = (0.55 * PIXEL_SCALE) * math.cos(p)

                  # BODY: tiny coherent breathing, two cycles per loop.
                  breath = math.sin(2.0*p)
                  sx = 0.00050 * breath
                  sy = 0.00280 * breath
                  lift = (-1.05 * PIXEL_SCALE) * breath

                  dx = water*wx + boat*boat_x
                  dy = water*wy + boat*boat_y

                  dx += body*((xx-cx)*sx)
                  dy += body*((yy-cy)*sy + lift)

                  frame = cv2.remap(
                      src,
                      (base_x-dx).astype(np.float32),
                      (base_y-dy).astype(np.float32),
                      interpolation=cv2.INTER_CUBIC,
                      borderMode=cv2.BORDER_REFLECT101
                  )

                  # Water shimmer is also exactly periodic.
                  shimmer = 1.0 + (0.010*math.sin(p))*water
                  frame = np.clip(
                      frame.astype(np.float32)*shimmer[...,None],
                      0,255
                  ).astype(np.uint8)

                  proc.stdin.write(frame.tobytes())
          finally:
              proc.stdin.close()
              rc = proc.wait()

          if rc != 0:
              raise SystemExit(f'ffmpeg failed with exit code {rc}')

          print(out, out.stat().st_size)
          PY
          python /tmp/render_wallpaper.py

      - name: Commit video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/wallpaper/iuno-loop-fixed.mp4
          git diff --cached --quiet && exit 0
          git commit -m 'Build animated wallpaper loop'
          git pull --rebase origin main
          git push
